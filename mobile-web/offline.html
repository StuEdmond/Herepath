<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Herepath</title>
    <style>
      html, body { height: 100%; margin: 0; background: #0e0f12; color: #f5f7fa; font-family: system-ui, sans-serif; }
      main { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 24px; text-align: center; }
      h1 { margin: 0; font-size: 24px; font-weight: 500; }
      p { margin: 0; max-width: 320px; color: #b7bec8; font-size: 15px; line-height: 1.5; }
      button { margin-top: 8px; min-height: 48px; padding: 0 24px; border: 0; border-radius: 8px; background: #2e7d5b; color: #fff; font-size: 15px; font-weight: 500; }
    </style>
  </head>
  <body>
    <main>
      <h1>No connection</h1>
      <p>Herepath needs a signal to load. Check your connection and try again.</p>
      <button type="button" onclick="history.length > 1 ? history.back() : location.reload()">Try again</button>
    </main>
  </body>
</html>
